<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | ज्ञानदीप वाचनालय</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand-mark">
      <div class="logo-badge">ज्ञा</div>
      <h2>Welcome Back</h2>
      <p class="sub">Login to ज्ञानदीप वाचनालय member portal</p>
    </div>

    <div class="alert alert-error" th:if="${param.error}">Invalid username or password. Please try again.</div>
    <div class="alert alert-success" th:if="${param.registered}">Account created successfully! Please login.</div>
    <div class="alert alert-info" th:if="${param.logout}">You have been logged out.</div>

    <form th:action="@{/login}" method="post">
      <div class="form-group">
        <label for="username">Username</label>
        <input class="form-control" type="text" id="username" name="username" required autofocus placeholder="e.g. admin or your username">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input class="form-control" type="password" id="password" name="password" required placeholder="&bull;&bull;&bull;&bull;&bull;&bull;">
      </div>
      <button type="submit" class="btn btn-navy btn-block">Login</button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a th:href="@{/register}" style="font-weight:700;">Register here</a>
    </div>
    <div class="auth-footer" style="margin-top:0.4rem;">
      <span class="chip">Demo admin: admin / Admin@123</span>
    </div>
  </div>
</div>

<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
